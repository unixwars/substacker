name: release
# Runs when a tag `vX.Y.Z` is pushed (see docs/releasing.md). Nobody creates the GitHub
# Release by hand: this workflow does, so a Release never exists without its tarball.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag the merge commit on main (docs/releasing.md); delete this tag."; exit 1; }
      - name: Check no Release exists for the tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "A GitHub Release for $GITHUB_REF_NAME already exists. This workflow creates it; delete the Release (not main) and push the tag again, or bump the patch version."; exit 1; fi
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          core="$(node -p "require('./packages/core/package.json').version")"
          root="$(node -p "require('./package.json').version")"
          test "v$core" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match packages/core version $core"; exit 1; }
          test "$root" = "$core" || { echo "Root version $root differs from packages/core version $core"; exit 1; }
          node scripts/sync-version.mjs --check
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - run: npm run typecheck && npm run lint && npm run test:unit
      # Includes packing substacker-core, installing the tarball in an empty project and importing every subpath.
      - run: npm run test:integration
      - name: Pack substacker-core
        run: |
          npm pack -w substacker-core --pack-destination .
          test -f "substacker-core-${GITHUB_REF_NAME#v}.tgz" || { echo "Expected substacker-core-${GITHUB_REF_NAME#v}.tgz was not produced"; ls *.tgz; exit 1; }
      - name: Create the GitHub Release with the tarball and the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "substacker-core-${GITHUB_REF_NAME#v}.tgz" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" $flags
