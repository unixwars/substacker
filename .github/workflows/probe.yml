# Plan task 1: can a GitHub-hosted runner reach the feed? Remove once the result is recorded.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [feat/probe]
    paths: [probes/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node probes/probe.mjs
        env:
          SUBSTACKER_CONFIG: ${{ vars.SUBSTACKER_CONFIG }}
